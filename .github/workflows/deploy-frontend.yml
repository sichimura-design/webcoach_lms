name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

permissions:
  id-token: write  # OIDC トークン発行に必要
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BFF_URL: ${{ secrets.PROD_REACT_APP_BFF_URL }}
          REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.PROD_REACT_APP_COGNITO_USER_POOL_ID }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ secrets.PROD_REACT_APP_COGNITO_CLIENT_ID }}
          GENERATE_SOURCEMAP: false
          CI: false
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1  # SPA バケット / CloudFront は us-east-1

      # 🔴 Cache-Control を明示する（dev-preview.yml と同じ）。付けないとブラウザが index.html を
      #    独自判断でキャッシュし、デプロイ後も削除済みの古い main.*.js/css を読みに行って修正前の
      #    画面が出続ける（CloudFront の無効化はブラウザのキャッシュには効かない）。
      #    - static/ はファイル名にハッシュが入るので長期キャッシュ
      #    - それ以外（index.html 等）は毎回サーバーに確認させる
      #    static/ を先に上げ、新しい index.html が参照するファイルが揃ってから index.html を差し替える。
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/static s3://${{ secrets.S3_BUCKET_NAME }}/static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          # static/ 以外は --delete しない。バケット直下には教材 HTML(materials/)や管理画面
          # 「コンテンツUP」で上げた画像(S3パスは自由入力のため images/ 等にも置ける)など
          # ビルドに無いファイルが同居しており、--delete だと除外し忘れた場所の画像が消える。
          # ビルドから消えたファイルは S3 に残るが、参照されないだけで害はない。
          # materials/ 等の exclude は「ビルド内の古い版で S3 側の原本を上書きしない」ために残す。
          aws s3 sync frontend/build s3://${{ secrets.S3_BUCKET_NAME }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "static/*" \
            --exclude "html-content/*" \
            --exclude "course-images/*" \
            --exclude "materials/*" \
            --exclude "vector_db/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
