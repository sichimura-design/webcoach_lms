name: Deploy Backend and Moodle App

on:
  push:
    branches:
      - master
    paths:
      - 'bff-server/**'
      - 'api-server/**'
      - 'nginx/**'
      - 'moodle-app/**'
  workflow_dispatch: # 手動トリガー（動作確認用）

permissions:
  id-token: write  # OIDC トークン発行に必要
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 840513866884.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: webcoach-lms
  ECS_CLUSTER: prod-lms-cluster
  ECS_SERVICE: prod-lms-service
  ECS_TASK_FAMILY: prod-lms-task

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # イメージタグは git SHA で固定（:latest だと、ECSのEC2ホストに同名タグの
      # 古いイメージが既にキャッシュされている場合に再pullされず新コードが反映されない
      # ことがあるため。過去にmoodle-appで実際に発生した障害と同じ原因を回避する）
      - name: Build and push BFF image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:moodle-bff-$GITHUB_SHA ./bff-server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-bff-$GITHUB_SHA
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:moodle-bff-$GITHUB_SHA $ECR_REGISTRY/$ECR_REPOSITORY:moodle-bff-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-bff-latest

      - name: Build and push API image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:moodle-api-$GITHUB_SHA ./api-server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-api-$GITHUB_SHA
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:moodle-api-$GITHUB_SHA $ECR_REGISTRY/$ECR_REPOSITORY:moodle-api-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-api-latest

      - name: Build and push nginx image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:moodle-nginx-$GITHUB_SHA ./nginx
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-nginx-$GITHUB_SHA
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:moodle-nginx-$GITHUB_SHA $ECR_REGISTRY/$ECR_REPOSITORY:moodle-nginx-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-nginx-latest

      # moodle-app/Dockerfile は固定タグ(moodle-app-base-*)を FROM しており、
      # 稼働中の moodle-app-latest を FROM しているわけではないため、ここで
      # -latest を更新してもビルドの土台が動くことはない（レイヤー無限増殖の懸念なし）。
      - name: Build and push moodle-app image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:moodle-app-$GITHUB_SHA ./moodle-app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-app-$GITHUB_SHA
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:moodle-app-$GITHUB_SHA $ECR_REGISTRY/$ECR_REPOSITORY:moodle-app-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:moodle-app-latest

      # 現行タスク定義を取得し、nginx / bff-server / api-server / moodle-app のイメージだけを
      # 今回ビルドしたSHA固定タグに差し替えて新リビジョンとして登録する
      - name: Render new task definition
        id: render-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query 'taskDefinition' \
            --output json > task-definition.json

          jq --arg registry "$ECR_REGISTRY" \
             --arg repo "$ECR_REPOSITORY" \
             --arg sha "$GITHUB_SHA" \
             '.containerDefinitions |= map(
                if .name == "bff-server" then
                  .image = ($registry + "/" + $repo + ":moodle-bff-" + $sha)
                elif .name == "api-server" then
                  .image = ($registry + "/" + $repo + ":moodle-api-" + $sha)
                elif .name == "nginx" then
                  .image = ($registry + "/" + $repo + ":moodle-nginx-" + $sha)
                elif .name == "moodle-app" then
                  .image = ($registry + "/" + $repo + ":moodle-app-" + $sha)
                else . end
              )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            task-definition.json > new-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy new task definition to ECS
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.render-task-def.outputs.task_def_arn }} \
            --region $AWS_REGION \
            --query "service.deployments[?status=='PRIMARY'].id | [0]" \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      # 🔴 aws ecs wait services-stable は使わない。
      #    待ち時間が最大10分(15秒×40回)固定で、本番は1台ずつ入れ替える設定(maximumPercent=100)のため
      #    2台の入れ替えだけで7〜10分かかり、実際には成功していても時間切れで「失敗」になっていた。
      #    また途中で別のデプロイ(cdk deploy 等)が入ると、自分のデプロイが上書きされても気付けなかった。
      #    ここでは「このワークフローが出したデプロイ」だけを最大25分まで追いかける
      - name: Wait for this deployment to complete
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          TASK_DEF_ARN: ${{ steps.render-task-def.outputs.task_def_arn }}
        run: |
          for i in $(seq 1 100); do
            STATE=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query "services[0].deployments[?id=='$DEPLOYMENT_ID'].[rolloutState, runningCount, desiredCount] | [0]" \
              --output text)
            echo "$(date -u +%H:%M:%S) $STATE"
            case "$STATE" in
              COMPLETED*)
                echo "デプロイ完了: $TASK_DEF_ARN"
                exit 0 ;;
              FAILED*)
                echo "::error::デプロイが失敗しました(サーキットブレーカーで元の版へ戻っています)"
                exit 1 ;;
              None|"")
                CURRENT=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
                  --region $AWS_REGION --query 'services[0].taskDefinition' --output text)
                echo "::error::このデプロイは別のデプロイに置き換えられました。現在の版: $CURRENT (このワークフローの版: $TASK_DEF_ARN)"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::25分待ってもデプロイが完了しませんでした"
          exit 1
