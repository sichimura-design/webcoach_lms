# docker-compose.awslogs.yml
# dev EC2(dev-moodle-docker)専用: api-server/bff-serverのログをCloudWatch Logsへも送る
# (Slack通知 cdk/lib/slack-notifier-stack.ts の入力になる)
#
# ローカル開発では読み込まない。EC2の /home/ec2-user/moodle-docker/.env に
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.awslogs.yml
# を書いておくと、既存の `docker-compose up -d ...` のままこのファイルも適用される。
# 送信権限はEC2ロールのCloudWatchAgentServerPolicyで足りている。
# Docker 20.10+のデュアルロギングにより `docker logs` もこれまで通り使える。

x-awslogs-options: &awslogs-options
  awslogs-region: ap-northeast-1
  # CloudWatchへの送信が詰まってもコンテナを止めない
  mode: non-blocking
  max-buffer-size: 4m

services:
  api-server:
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /dev/moodle/api-server
        awslogs-stream: api-server

  bff-server:
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: /dev/moodle/bff-server
        awslogs-stream: bff-server
