<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', sans-serif; }

    /* ══════════════════════════════════════════════════════════════════════
       STU-06-new 新規ノート /notes?note=<新しく作ったid>
       一覧の「新しいノート」を押した直後。ブロックが1つも無く、書き足し欄だけがある状態。
       実装: components/notes/NoteEditor.tsx / NoteEditorBar.tsx / NoteEditorToolbar.tsx
       出典: design-canvas/_capture/STU-06-new/1440.{png,styles.json}
       ══════════════════════════════════════════════════════════════════════ */

    /* 🔒 index.css L91-145 の .wc-warm と同値 */
    .n6 {
      --dc-primary: #D60934;
      --dc-soft-100: #FDF2F2;
      --dc-soft-200: #F5D8DB;
      --dc-bg: #FBF8F4;
      --dc-surface: #FFFFFF;
      --dc-text: #141414;
      --dc-text-body: #3D3D3D;
      --dc-text-muted: #6B6B6B;
      --dc-text-subtle: #9E9E9E;
      --dc-border: #EFE9E0;
      --dc-border-strong: #E2DBD0;
      --dc-shadow-card: 0 1px 2px rgba(60,48,32,.05), 0 12px 24px -16px rgba(60,48,32,.14);
      --dc-radius-md: 12px;
      --dc-radius-lg: 20px;
    }

    /* 🔒 本文ブロックだけは --dc-* ではなく theme/webcoachTheme.ts L85-97 の色を使う。
          2系統が混在しているのは実装がそうなっているため。混ぜて片方に寄せないこと。 */
    .n6 {
      --wc-note-paper: #FFFDFA;
      --wc-text: #1F1D1E;
      --wc-text-strong: #2B2629;
      --wc-text-body: #4A4245;
      --wc-text-faint: #9A9295;
      --wc-clip-bg: #FFF4F5;
      --wc-clip-accent: #D60934;
      --wc-answer-bg: #F3FAF6;
      --wc-answer-accent: #3E9E70;
      --wc-note-highlight: #FFD9E0;
    }

    .n6 .num { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-variant-numeric: tabular-nums; }

    .n6 .rail-item {
      width: 40px; height: 40px; border: 0; padding: 0; background: transparent;
      display: grid; place-items: center; border-radius: 12px; cursor: pointer;
    }
    .n6 .rail-item-active { background: #D60934; box-shadow: 0 4px 16px -8px rgba(214,9,52,.25); }

    /* 上部バーのボタン（.notes-tool / index.css:1875）。ツールバー側は --light */
    .n6 .tool {
      display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
      border: 1px solid var(--dc-border-strong); border-radius: 8px;
      background: var(--dc-surface); color: var(--dc-text-body);
      font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    /* 🔒 重要ON の文字色。実装は var(--dc-primary-deep) を当てているが、この変数は
          どこにも定義されていない（index.css:1900 で使用のみ）。未定義の var() は
          無効値になるので color は継承し、実際は #141414 になる。赤にしないこと。 */
    .n6 .tool.is-on { background: var(--dc-soft-100); border-color: var(--dc-soft-200); color: var(--dc-text); }
    .n6 .tool--light { font-weight: 500; }

    /* ブロックの行（.notes-block / index.css:1928-1932）。
       ホバー時だけ左に ⠿ と ＋ が出る（→ NoteEditorMenus.dc.html）。
       左の 34px はその2つのぶんの席。ホバーで .notes-block:hover が #FCF9F5 になる。 */
    .n6 .block { position: relative; padding: 4px 0 4px 34px; border-radius: 6px; }
    /* 見出しのマーカー（.wc-note-mark / index.css:2140-2144）。
       背景ベタではなく下側だけの帯にする（文字が沈まず、手書きの線に近い）。 */
    .n6 .mark { background: linear-gradient(transparent 62%, var(--wc-note-highlight) 62%); padding-bottom: 1px; }
    /* 本文中の ==…== は同じ .wc-note-mark を付けるが、renderInline が
       background:none / color:inherit をインラインで上書きするので帯は出ない
       （noteText.tsx:47）。見た目が素の文字と同じになるのは実装どおり。 */
    .n6 .mark-inline { padding-bottom: 1px; }
    /* 本文の段落・見出し・箇条書き（noteText.tsx:123-145 の実値） */
    .n6 .p { margin: 0 0 6px; font-size: 13.5px; line-height: 2; color: var(--wc-text-body); }
    .n6 .h { margin: 18px 0 10px; font-size: 15.5px; font-weight: 900; line-height: 1.6; color: var(--wc-text); }
    .n6 .ul { margin: 6px 0 12px; padding-left: 20px; }
    .n6 .ul li { font-size: 13.5px; line-height: 2; color: var(--wc-text-body); }
    /* clip / answer の器。左罫3px ＋ 右側だけ角丸 */
    .n6 .callout {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 10px 0; padding: 13px 16px; border-radius: 0 12px 12px 0;   /* radius.sm = 12（webcoachTheme.ts:110）*/
    }
    .n6 .callout-label { font-size: 11.5px; font-weight: 700; }
    /* 出どころ行。文字は textMuted、右端の時刻だけ textFaint（実測どおり） */
    .n6 .src {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      font-size: 11.5px; font-weight: 500; color: #6B6467;
    }
    .n6 .src .num { margin-left: auto; color: var(--wc-text-faint); }
  </style>
</helmet>

<div class="n6"
     data-dc-id="STU-06-new"
     data-dc-remote="マイノート 新規ノート 現行実装.dc.html"
     data-dc-route="/notes?note=<新しく作ったid>"
     data-dc-src="frontend/src/components/notes/NoteEditor.tsx"
     style="position: relative; display: flex; width: 1440px; min-height: 900px; background: var(--dc-bg); color: var(--dc-text); font-size: 14px;">

  <!-- ───────── サイドバー：閉じた72pxレール（NotesList.dc.html と同じもの）───────── -->
  <div style="width: 72px; flex: none; background: #FDF7F3; border-right: 1px solid #E2DBD0; box-shadow: 3px 0 10px -4px rgba(60,48,32,.18); padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <button type="button" class="rail-item" style="border-radius: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#D60934" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path>
      </svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></div>
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path></svg></div>
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg></div>
      <div class="rail-item rail-item-active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FDF7F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"></path><path d="M2 6h4"></path><path d="M2 10h4"></path><path d="M2 14h4"></path><path d="M2 18h4"></path><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"></path></svg></div>
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></div>
      <div style="width: 32px; height: 1px; background: #EFE9E0; margin: 14px 0;"></div>
      <div class="rail-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
    </div>
    <div style="flex: 1;"></div>
    <button type="button" style="width: 36px; height: 36px; border: 0; border-radius: 9999px; background: #F2E8E1; display: grid; place-items: center; font-family: inherit; font-size: 11px; font-weight: 700; color: #9E9698; cursor: pointer;">モッ</button>
  </div>

  <!-- ───────── 本文（.notes-content）───────── -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">

    <!-- .notes-main。ノート面は gap: 14 の縦積み（MyNotesPage.tsx:380） -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 24px 28px 28px; box-sizing: border-box;">

      <!-- ───────── ① 上部バー（NoteEditorBar.tsx）─────────
           左から: 戻る／教材へ戻る／保存先ピル／(spacer)／速記メモ／保存状態／重要／その他 -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 31px; padding: 6px 10px 6px 4px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--dc-primary); cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
          マイノートに戻る
        </button>

        <!-- 🔴「「〜」に戻る」は出ない。教材から作られたノートだけに付く導線で、
             新規作成のノートは source を持たないため。 -->

        <!-- 保存先のフォルダ。押すと下に「移動先」メニュー → NoteEditorMenus.dc.html -->
        <!-- 🔒 未整理はブランド色。フォルダに入っているときは本文色（NoteEditorBar の FolderPill） -->
        <button type="button" class="tool" style="color: var(--dc-primary);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
          <span>未整理</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </button>

        <div style="flex: 1;"></div>

        <!-- 速記メモ（Document PiP の小窓を開く）→ QuickMemoWindow.dc.html -->
        <button type="button" class="tool">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"></path><rect width="10" height="7" x="12" y="3" rx="1"></rect></svg>
          速記メモを小窓で開く
        </button>

        <!-- 保存状態。3態は NoteEditorBarStates.dc.html にまとめてある -->
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dc-text-muted);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2FA35C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          保存しました <span class="num" style="color: var(--dc-text-subtle);">14:57</span>
        </span>

        <button type="button" class="tool">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
          重要にする
        </button>

        <!-- 押すと1項目だけのメニュー「このノートを削除」→ NoteEditorMenus.dc.html -->
        <button type="button" class="tool">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
          その他
        </button>
      </div>

      <!-- ───────── ② 紙（NoteEditor.tsx:180-192）─────────
           🔒 maxWidth 900・flex:1。紙をページの高さいっぱいに伸ばす（実装のコメント:
              伸ばさないと書きかけの空ノートの下にフッターまでの空白が残る）。 -->
      <div style="width: 100%; max-width: 900px; background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: var(--dc-radius-lg); box-shadow: var(--dc-shadow-card); overflow: hidden; flex: 1; display: flex; flex-direction: column;">

        <!-- ②-a タイトル（padding: 22px 28px 18px、下に1px罫） -->
        <div style="padding: 22px 28px 18px; border-bottom: 1px solid var(--dc-border);">
          <div style="font-size: 11px; font-weight: 700; color: var(--dc-text-subtle); margin-bottom: 6px;">タイトル</div>
          <!-- 未入力なので placeholder「無題のノート」が出ている状態 -->
          <div style="font-size: 22px; font-weight: 900; line-height: 1.4; color: var(--dc-text-subtle);">無題のノート</div>
          <!-- 🔴 出どころ行（コース名 / レッスン名）は出ない。source を持たないため。 -->
        </div>

        <!-- ②-b 常設ツールバー（NoteEditorToolbar.tsx。地は #FFFDFA、下に1px罫）
             🔒 並びは 見出し／箇条書き／画像／教材から引用／チェックリスト。
                「教材から引用」だけ別扱いでモーダルを開く（画面遷移しない）。 -->
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 28px; border-bottom: 1px solid var(--dc-border); background: var(--wc-note-paper);">
          <button type="button" class="tool tool--light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"></path><path d="M6 20V4"></path><path d="M18 20V4"></path></svg>
            見出し
          </button>
          <button type="button" class="tool tool--light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg>
            箇条書き
          </button>
          <button type="button" class="tool tool--light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
            画像
          </button>
          <button type="button" class="tool tool--light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>
            教材から引用
          </button>
          <button type="button" class="tool tool--light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg>
            チェックリスト
          </button>
          <span style="margin-left: auto; font-size: 11px; color: var(--dc-text-subtle); white-space: nowrap;">行にカーソルを置くと、左に ⠿ と ＋ が出ます</span>
        </div>

        <!-- ②-c 本文（padding: 20px 28px 24px、行間 gap: 2）─────────
             🔒 ブロックは種別ごとにセクションを分けず、同じ流れに混在させる。
                左の 34px は ⠿ と ＋ のぶんの余白（ホバー時だけ出る）。 -->
        <div style="flex: 1; padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 2px;">

          <!-- ②-d 末尾の書き足し欄。常にここが「次に書く場所」になる。
               最小高さ96px、余白をクリックしても入力に入れる。
               入力があるときだけ下に「保存する」が出る → NoteTail.dc.html -->
          <div class="block">
            <!-- 🔒 空のノートだけ placeholder が変わる（isEmptyNote）。
                 ブロックが1つでもあると「続きを書く…」になる。 -->
            <div style="min-height: 96px; padding: 4px 0; font-size: 13.5px; line-height: 1.9; color: var(--dc-text-subtle);">ここに入力して、自由に書いていきましょう…</div>
          </div>

          <!-- 🔴「保存する」と「Ctrl+Enter でも保存できます」はここには出ない。
               未確定の入力があるときだけ出る（NoteEditor.tsx:345）。常設すると、
               空のノートの下端に押せないボタンと注記が居座って余白が締まらない。
               入力ありの姿は NoteTail.dc.html にある。 -->
        </div>
      </div>
    </div>

    <div style="text-align: center; font-size: 12px; color: var(--dc-text-subtle); padding: 32px 0 24px;">2026 © WEBCOACH</div>
  </div>
</div>
</x-dc>
</body>
</html>
