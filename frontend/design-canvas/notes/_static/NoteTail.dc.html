<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', sans-serif; }

    /* ══════════════════════════════════════════════════════════════════════
       STU-06-P10 末尾の書き足し欄 2態（部品）
       実装: components/notes/NoteEditor.tsx:299-374
       出典: _capture/STU-06-note-rich/1440（空）・_capture/STU-06-tail/1440（入力あり）
       ⚠ 部品ボード。幅 844px は紙の内側（900 − 左右 28）。
       ══════════════════════════════════════════════════════════════════════ */

    .n6 {
      --dc-primary: #D60934;
      --dc-bg: #FBF8F4;
      --dc-surface: #FFFFFF;
      --dc-text-subtle: #9E9E9E;
      --dc-border: #EFE9E0;
      --dc-radius-md: 12px;
      --wc-text-body: #4A4245;
    }

    /* 紙の内側を模した白地。実寸を見るためにここだけ紙を切り出している */
    .n6 .paper { width: 900px; box-sizing: border-box; padding: 0 28px 24px;
                 background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: 0 0 20px 20px; }
    .n6 .block { position: relative; padding: 4px 0 4px 34px; border-radius: 6px; }
    .n6 .cap { font-size: 11.5px; font-weight: 700; color: #8A8178; margin-bottom: 10px; }
    .n6 .cap span { font-weight: 400; color: #A79E93; }
    .n6 .note { margin-top: 12px; font-size: 11px; line-height: 1.7; color: #A79E93; width: 900px; }
  </style>
</helmet>

<div class="n6"
     data-dc-id="STU-06-P10"
     data-dc-remote="マイノート 部品 書き足し欄.dc.html"
     data-dc-route="/notes?note=<id>"
     data-dc-src="frontend/src/components/notes/NoteEditor.tsx#L299-L374"
     style="display: flex; flex-direction: column; gap: 30px; width: 960px; min-height: 420px; padding: 24px; box-sizing: border-box; background: var(--dc-bg);">

  <!-- ───────── ① 空（何も書いていない）─────────
       🔴 紙の下端まで伸ばして、余白をクリックしても入力に入れるようにしてある。
          以前は2行分の textarea だけで、下に広い空白が残って
          「ここから下は何なのか」が分からなかった（実装のコメント）。 -->
  <div>
    <div class="cap">空 <span>／ 保存するボタンは出ない</span></div>
    <div class="paper" style="padding-top: 20px;">
      <div class="block">
        <div style="min-height: 96px; padding: 4px 0; font-size: 13.5px; line-height: 1.9; color: var(--dc-text-subtle);">続きを書く…</div>
      </div>
    </div>
    <div class="note">
      placeholder は2種: ブロックが1つも無いノートは「ここに入力して、自由に書いていきましょう…」、
      1つでもあれば「続きを書く…」。最小高さ 96px、行数に応じて自動で伸びる。
    </div>
  </div>

  <!-- ───────── ② 入力あり ─────────
       🔴 未確定の入力があるときだけ「保存する」と注記が出る。常設すると、
          空のノートの下端に押せないボタンと注記が居座って余白が締まらない。 -->
  <div>
    <div class="cap">入力あり <span>／「保存する」と注記が出る</span></div>
    <div class="paper" style="padding-top: 20px;">
      <div class="block">
        <div style="min-height: 96px; padding: 4px 0; font-size: 13.5px; line-height: 1.9; color: var(--wc-text-body);">書きかけの1行</div>
      </div>
      <!-- 左の 34px は ⠿ / ＋ の席に揃える（paddingLeft: 34） -->
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-left: 34px;">
        <button type="button" style="display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 20px; border: 0; border-radius: var(--dc-radius-md); background: var(--dc-primary); color: #fff; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          保存する
        </button>
        <span style="font-size: 11.5px; color: var(--dc-text-subtle);">Ctrl+Enter でも保存できます</span>
      </div>
    </div>
    <div class="note">
      確定のきっかけは3つ: このボタン／Ctrl（⌘）+ Enter／欄から外れる（blur）。
      確定すると text ブロックが1つ増え、欄は空に戻る。
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
