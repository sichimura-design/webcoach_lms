<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', sans-serif; }

    /* ══════════════════════════════════════════════════════════════════════
       STU-06-P06 スケルトン ＋ ページ送り（部品）
       実装: NoteGrid.tsx:68-85（読み込み中のスケルトン）
             NotesPagination.tsx（ページ送り）
       出典: _capture/STU-06/1440（ページ送り）。スケルトンは NoteGrid.tsx から写経
             （読み込みが一瞬で終わるためキャプチャに残らない）。
       ⚠ 部品ボード。幅 1312px は一覧の本文幅（1440 − サイドバー72 − 左右28）。
       ══════════════════════════════════════════════════════════════════════ */

    /* 🔒 index.css L91-145 の .wc-warm と同値 */
    .n6 {
      --dc-primary: #D60934;
      --dc-bg: #FBF8F4;
      --dc-surface: #FFFFFF;
      --dc-text-body: #3D3D3D;
      --dc-text-muted: #6B6B6B;
      --dc-border: #EFE9E0;
      --dc-border-strong: #E2DBD0;
      --dc-shadow-card: 0 1px 2px rgba(60,48,32,.05), 0 12px 24px -16px rgba(60,48,32,.14);
      --dc-radius-lg: 20px;
    }
    .n6 .num { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }

    /* ページ送りの丸（NotesPagination.tsx。36px・fontSize 14） */
    .n6 .pager-btn {
      width: 36px; height: 36px; border-radius: 9999px; border: 1px solid var(--dc-border-strong);
      background: var(--dc-surface); color: var(--dc-text-muted);
      display: inline-grid; place-items: center; cursor: pointer;
    }
    .n6 .pager-num {
      width: 36px; height: 36px; border-radius: 9999px; border: 0; background: transparent;
      color: var(--dc-text-body); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
      display: inline-grid; place-items: center; cursor: pointer;
    }
    .n6 .pager-num.is-current { background: var(--dc-primary); color: #FFFFFF; }

    .n6 .cap { font-size: 11.5px; font-weight: 700; color: #8A8178; margin-bottom: 10px; }
    .n6 .cap span { font-weight: 400; color: #A79E93; }
  </style>
</helmet>

<div class="n6"
     data-dc-id="STU-06-P06"
     data-dc-remote="マイノート 部品 スケルトンとページ送り.dc.html"
     data-dc-route="/notes"
     data-dc-src="frontend/src/components/notes/NotesPagination.tsx"
     style="display: flex; flex-direction: column; gap: 32px; width: 1360px; min-height: 320px; padding: 24px; box-sizing: border-box; background: var(--dc-bg);">

  <!-- ───────── ① 読み込み中のスケルトン ─────────
       🔒 176px の箱を3つ。カード（190px）より少し低い。
          グリッドは一覧と同じ .notes-grid（3列・gap 20）。aria-busy="true" が付く。 -->
  <div>
    <div class="cap">読み込み中 <span>／ 一覧を開いた直後・並びや絞り込みを変えた直後</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, 424px); gap: 20px;">
      <div style="height: 176px; background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: var(--dc-radius-lg); box-shadow: var(--dc-shadow-card);"></div>
      <div style="height: 176px; background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: var(--dc-radius-lg); box-shadow: var(--dc-shadow-card);"></div>
      <div style="height: 176px; background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: var(--dc-radius-lg); box-shadow: var(--dc-shadow-card);"></div>
    </div>
  </div>

  <!-- ───────── ② ページ送り ─────────
       1ページ 24件（PAGE_SIZE = 24 ＝ 3列×8行）。
       🔒 件数は絶対配置で右端（.notes-pager-count）。767px 以下では位置が変わる。 -->
  <div>
    <div class="cap">ページ送り <span>／ 1件以上あるときだけ出る。1ページ24件</span></div>
    <div style="position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding-top: 4px; width: 1312px;">
      <button type="button" class="pager-btn" title="前のページ">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <button type="button" class="pager-num is-current">1</button>
      <button type="button" class="pager-num">2</button>
      <button type="button" class="pager-num">3</button>
      <button type="button" class="pager-num">4</button>
      <button type="button" class="pager-num">5</button>
      <button type="button" class="pager-btn" title="次のページ">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <span class="num" style="position: absolute; right: 0; font-size: 12px; color: var(--dc-text-muted);">1–24 / 100件</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
