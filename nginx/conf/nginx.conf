events {
    worker_connections 1024;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;  # Hide nginx version

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # DNS resolver for dynamic upstream resolution (Docker DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=600r/m;

    # CORS allowed origins mapping (HTTPS only for security)
    map $http_origin $cors_origin {
        default "";
        "https://localhost" $http_origin;
        "https://localhost:3000" $http_origin;
        "https://localhost:3001" $http_origin;
        "https://dils5ct97pefc.cloudfront.net" $http_origin;
        "https://d1zs9qsimyg41i.cloudfront.net" $http_origin;
        "https://dmn2v7nl0g3fq.cloudfront.net" $http_origin;
        "https://uat.webcoach.jp" $http_origin;
        "https://study.webcoach.jp" $http_origin;
        "https://api.webcoach.jp" $http_origin;
    }

    # Upstream servers with dynamic DNS resolution
    # Using variables to force DNS re-resolution on each request
    # This prevents issues when container IPs change

    # BFF_HOST/MOODLE_HOST are substituted at container start by
    # docker-entrypoint.sh (envsubst, see Dockerfile) so the same image works
    # both in docker-compose (Docker DNS service names, e.g. moodle-bff:3001)
    # and in ECS EC2 host network mode, where there is no Docker DNS and
    # sibling containers are reached via localhost (e.g. localhost:3001).
    # Getting this wrong doesn't show up as a redirect loop or TLS error --
    # it surfaces as a 502 with "could not be resolved" in the nginx error
    # log, only once traffic actually reaches these proxy_pass locations
    # (found 2026-09-22 while fixing the api.webcoach.jp redirect loop: prod
    # traffic had never exercised this code path before, since it always hit
    # the redirect loop first).
    #
    # Set variables for dynamic DNS resolution
    # NOTE: upstream blocks cache DNS, so we use variables + resolver instead
    map $request_uri $bff_backend {
        default "${BFF_HOST}";
    }

    map $request_uri $moodle_backend {
        default "${MOODLE_HOST}";
    }

    # Single server serving both plain HTTP (80) and TLS (443, self-signed cert).
    #
    # Historically this was two separate server blocks: 80 only redirected to
    # HTTPS, and all the real proxy_pass logic lived in the 443 block. That
    # broke behind an ALB that terminates the public TLS certificate itself
    # and forwards to this container as plain HTTP on port 80: every request
    # landed in the 80 block's unconditional "redirect to https" and looped
    # forever, since nginx had no way to tell "genuinely plain HTTP" apart
    # from "TLS already terminated upstream" (api.webcoach.jp incident,
    # 2026-09-21/22). The two blocks are merged here so both ports share the
    # same proxy logic; only genuinely-plaintext requests (no X-Forwarded-Proto:
    # https from a trusted upstream) get redirected to HTTPS.
    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        # SSL configuration (only relevant for the port-443 socket)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Strong TLS configuration (TLSv1.3 only for maximum security)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;  # TLSv1.3 uses client preference
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;" always;

        # Max upload size (reduced from 100M for security)
        client_max_body_size 50M;

        # The externally-visible protocol: "https" whenever the client's
        # original connection was secure, whether that's native TLS on this
        # socket (port 443) or an upstream (ALB) that already terminated TLS
        # and forwards to us on port 80 with X-Forwarded-Proto: https.
        # Used both for the HTTP->HTTPS redirect decision below and for the
        # X-Forwarded-Proto header we pass to the backends -- passing the raw
        # $scheme here always reads "http" for ALB-forwarded traffic, which
        # made Moodle generate http:// links (favicon, asset URLs, ...) and
        # get them blocked by the img-src CSP directive (found 2026-09-23,
        # once traffic finally reached Moodle after the redirect-loop/502
        # fixes above).
        set $external_proto $scheme;
        if ($http_x_forwarded_proto = https) {
            set $external_proto https;
        }

        # Health check endpoint for the ALB/local health checks (no redirect,
        # no upstream dependency so a BFF hiccup doesn't take nginx out of
        # rotation too)
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Authentication page (Cognito token acquisition)
        location /auth.html {
            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $bff_upstream $bff_backend;
            proxy_pass http://$bff_upstream/auth.html;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Swagger UI documentation
        location /api-docs {
            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $bff_upstream $bff_backend;
            proxy_pass http://$bff_upstream/api-docs;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Pass Authorization header for JWT authentication
            proxy_set_header Authorization $http_authorization;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Login endpoint (redirect /login to /api/login)
        location = /login {
            # Rate limiting for brute-force protection
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;

            # Handle preflight OPTIONS requests (answered directly, no redirect,
            # so CORS preflight succeeds regardless of which port it arrives on)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $bff_upstream $bff_backend;
            proxy_pass http://$bff_upstream/api/login;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Origin $http_origin;

            # Cookie & CORS support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Pass CORS headers from backend
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # User info endpoint (exact match, won't affect other /user/* paths)
        location = /user/info {
            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $bff_upstream $bff_backend;
            proxy_pass http://$bff_upstream/user/info;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Origin $http_origin;

            # Cookie & CORS support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Pass CORS headers from backend
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # BFF API proxy
        location /api/ {
            # Rate limiting for API endpoints
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            # Handle preflight OPTIONS requests (answered directly, no redirect)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $bff_upstream $bff_backend;
            proxy_pass http://$bff_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Origin $http_origin;

            # IMPORTANT: Pass Authorization header for JWT authentication
            proxy_set_header Authorization $http_authorization;

            # Cookie & CORS support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Pass CORS headers from backend (don't add here to avoid duplication)
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Moodle app proxy (main site)
        location / {
            if ($external_proto != https) {
                return 301 https://$host$request_uri;
            }

            set $moodle_upstream $moodle_backend;
            proxy_pass http://$moodle_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Cookie support
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
        }
    }
}
